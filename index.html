<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorteo BMW M4</title>
  <link rel="stylesheet" href="styles.css">

</head>
<body>

  <div class="contenedor">

    <div class="banner">
      <img src="https://images.unsplash.com/photo-1555215695-3004980ad54e?q=80&w=1200" alt="BMW">
      <h1>Sorteo BMW M4 2020</h1>
    </div>

    <div class="info">
      <h2>$100 MXN por boleto</h2>
      <p>Fecha del sorteo: 20 de Diciembre 2026</p>
    </div>

    <div class="boletos" id="listaBoletos">
    </div>

    <button class="boton" onclick="enviarWhatsApp()">
      Participar por WhatsApp
    </button>
  </div>

  <script>
    const listaBoletos = document.getElementById("listaBoletos");
    let boletosSeleccionados = [];
    // CREAR 100 BOLETOS
    for(let i = 1; i <= 100; i++){
      let div = document.createElement("div");
      div.classList.add("boleto");
      let numero = i.toString().padStart(3,"0");
      div.innerText = numero;
      div.addEventListener("click", ()=>{
        div.classList.toggle("seleccionado");
        if(boletosSeleccionados.includes(numero)){
          boletosSeleccionados =
          boletosSeleccionados.filter(b => b !== numero);
        }else{
          boletosSeleccionados.push(numero);
        }
        console.log(boletosSeleccionados);
      });
      listaBoletos.appendChild(div);
    }
    function enviarWhatsApp(){
      if(boletosSeleccionados.length === 0){
        alert("Selecciona al menos un boleto");
        return;
      }
      let mensaje =
      `Hola, quiero apartar los boletos: ${boletosSeleccionados.join(", ")}
      Adjunto mi foto de comprobante de transferencia para participar en el sorteo.`;
      let telefono = "+523324447372";
      let url =
      `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
      window.open(url, "_blank");
    }
  </script>

</body>
</html>
